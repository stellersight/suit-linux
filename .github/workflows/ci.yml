name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  e2e:
    name: End to end (${{ matrix.base }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base: ['debian:12-slim', 'rockylinux:9.3-minimal', 'alpine:3.20']
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BASE=${{ matrix.base }} -f tests/e2e/Dockerfile -t suit-e2e .
      - run: docker run --rm suit-e2e | tee e2e.log && grep -q ', 0 failed' e2e.log

  reboot:
    name: Real reboot (Debian 12 VM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Allow the runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: docker build -f tests/vm/Dockerfile -t suit-vm .
      - run: docker run --rm --device /dev/kvm suit-vm

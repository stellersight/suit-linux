# SUIT for Linux: .deb and .rpm, built with nfpm (https://nfpm.goreleaser.com).
#   VERSION=0.2.0 nfpm package -f packaging/nfpm-suit.yaml -p deb -t dist/
name: suit-linux
arch: all
platform: linux
version: ${VERSION}
prerelease: ${PRERELEASE}
section: admin
priority: optional
maintainer: StellerSight Private Limited <security@stellersight.com>
vendor: StellerSight Private Limited
homepage: https://github.com/stellersight/suit-linux
license: Apache-2.0
description: |-
  Just-in-time broker for privileged commands
  Users hold only a sudo rule for the broker. It runs one exact, root-owned
  command line for an approved, unexpired grant bound to the current boot,
  and records every decision in a hash-chained audit log.
depends:
  - python3 (>= 3.8)
  - sudo
overrides:
  rpm:
    depends:
      - python3 >= 3.8
      - sudo
contents:
  - src: suitlinux/__init__.py
    dst: /usr/lib/suit/suitlinux/__init__.py
    file_info: {mode: 0644, owner: root, group: root}
  - src: suitlinux/audit_v1.py
    dst: /usr/lib/suit/suitlinux/audit_v1.py
    file_info: {mode: 0644, owner: root, group: root}
  - src: suitlinux/broker.py
    dst: /usr/lib/suit/suitlinux/broker.py
    file_info: {mode: 0644, owner: root, group: root}
  - src: suitlinux/cli.py
    dst: /usr/lib/suit/suitlinux/cli.py
    file_info: {mode: 0644, owner: root, group: root}
  - src: suitlinux/clock.py
    dst: /usr/lib/suit/suitlinux/clock.py
    file_info: {mode: 0644, owner: root, group: root}
  - src: suitlinux/policy.py
    dst: /usr/lib/suit/suitlinux/policy.py
    file_info: {mode: 0644, owner: root, group: root}
  - src: suitlinux/store.py
    dst: /usr/lib/suit/suitlinux/store.py
    file_info: {mode: 0644, owner: root, group: root}
  - src: bin/suit
    dst: /usr/sbin/suit
    file_info: {mode: 0755, owner: root, group: root}
  - src: bin/suit-exec
    dst: /usr/sbin/suit-exec
    file_info: {mode: 0755, owner: root, group: root}
  - src: etc/sudoers.suit
    dst: /etc/sudoers.d/suit
    type: config|noreplace
    file_info: {mode: 0440, owner: root, group: root}
  - src: packaging/profiles.json
    dst: /etc/suit/profiles.json
    type: config|noreplace
    file_info: {mode: 0644, owner: root, group: root}
  - src: packaging/eligibility.json
    dst: /etc/suit/eligibility.json
    type: config|noreplace
    file_info: {mode: 0644, owner: root, group: root}
  - dst: /etc/suit
    type: dir
    file_info: {mode: 0755, owner: root, group: root}
  - src: etc/profiles.example.json
    dst: /usr/share/doc/suit-linux/profiles.example.json
    file_info: {mode: 0644}
  - src: etc/eligibility.example.json
    dst: /usr/share/doc/suit-linux/eligibility.example.json
    file_info: {mode: 0644}
  - src: README.md
    dst: /usr/share/doc/suit-linux/README.md
    file_info: {mode: 0644}
  - src: LICENSE
    dst: /usr/share/doc/suit-linux/LICENSE
    file_info: {mode: 0644}
  - src: NOTICE
    dst: /usr/share/doc/suit-linux/NOTICE
    file_info: {mode: 0644}
scripts:
  postinstall: packaging/postinstall.sh
  postremove: packaging/postremove.sh
